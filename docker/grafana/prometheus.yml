global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'commerce-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # 다중 인스턴스로 띄울 때는 관리 포트를 늘려가며 target 을 추가한다.
      - targets:
          - 'host.docker.internal:8081'
          # - 'host.docker.internal:8181'
          # - 'host.docker.internal:8281'

  - job_name: 'commerce-streamer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8091']

  - job_name: 'commerce-batch'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8093']
